name: update-data
on:
  schedule:
    - cron: "*/30 * * * *"  # 備援；主要由 cron-job.org 每分鐘觸發
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: 抓一次解題資料
        env:
          FZT_USER: ${{ secrets.FZT_USER }}
          FZT_PASS: ${{ secrets.FZT_PASS }}
        run: |
          git config user.name "fzt-bot"
          git config user.email "fzt-bot@users.noreply.github.com"
          python3 scripts/update.py
          if [ -n "$(git status --porcelain data.json)" ]; then
            git add data.json
            git commit -m "更新解題資料"
            git pull --rebase -q origin main || true
            git push -q
          fi
