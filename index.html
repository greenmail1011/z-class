<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coder 解題一覽｜FZT Judge</title>
<style>
  :root{--bg:#f5f7fb;--ink:#1c2433;--muted:#667085;--line:#d9e0ec;--ok:#00bb00;--okbg:#e4f7e4;--no:#eef0f4;--acc:#4d6aa8;--hot:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
  h1{margin:0 0 4px;font-size:1.7rem}
  h2.t{margin:28px 0 10px;font-size:1.2rem}
  .sub{color:var(--muted);margin:0 0 18px}
  .tabs{display:flex;gap:8px;margin:0 0 4px;border-bottom:2px solid var(--line)}
  .tabs button{font:inherit;font-weight:700;padding:8px 22px;border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;background:#e9edf5;color:var(--muted);cursor:pointer;margin-bottom:-2px}
  .tabs button[aria-selected=true]{background:#fff;color:var(--ink);border-bottom:2px solid #fff}
  .tabs button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px}
  .feed-day{margin:6px 0 2px;font-size:.85rem;color:var(--muted);font-weight:700}
  .feed li{margin:3px 0}
  .feed ul{margin:0;padding-left:20px}
  .empty{color:var(--muted)}
  .nm{font-weight:700;color:var(--acc);text-decoration:none}
  .demo{font-size:.72rem;padding:0 6px;border-radius:5px;background:#eef0f4;color:#667085;font-weight:400;border:1px dashed #b8c0d0}
  .nm:hover{text-decoration:underline}
  .tag{display:inline-block;font-size:.78rem;padding:0 6px;border-radius:5px;background:var(--okbg);color:#0a7a0a;margin:0 2px;text-decoration:none;font-weight:700}
  .tag.first{background:#fff3d6;color:#9a5b00;border:1px solid #f3d38b}
  table.rank{width:100%;border-collapse:collapse}
  table.rank th,table.rank td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
  table.rank th{background:#eef2f9;font-size:.9rem}
  table.rank td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{height:10px;background:var(--no);border-radius:5px;overflow:hidden;min-width:100px}
  .bar i{display:block;height:100%;background:var(--ok)}
  .up{color:#b45309;font-weight:700;font-size:.85rem}
  .plink{color:var(--acc);text-decoration:none}
  .plink:hover{text-decoration:underline}
  .chk{display:inline-block;min-width:24px;border-radius:6px;background:var(--okbg);color:#0a7a0a;font-weight:700}
  .chk.new{background:#fff3d6;color:#9a5b00;border:1px solid var(--hot)}
  .dash{color:#c3c9d6}
  .wip{display:inline-block;min-width:24px;border-radius:6px;background:#fff3d6;color:#b45309;font-weight:700;border:1px solid var(--hot);animation:glow 1.1s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0);background:#fff3d6}50%{box-shadow:0 0 10px 3px rgba(245,158,11,.75);background:#ffe3a3}}
  @media (prefers-reduced-motion:reduce){.wip{animation:none;box-shadow:0 0 6px 2px rgba(245,158,11,.6)}}
  table.done th{white-space:nowrap}
  .note{color:var(--muted);font-size:.85rem;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Coder 解題一覽</h1>
  <p class="sub">資料更新：<span id="stamp"></span>　點 Coder 姓名可看完整解題統計。✎ 閃爍＝正在做（已提交、還沒通過）。</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panels"></div>
  <p class="note">「範例」是示範用的虛擬 Coder，用來展示解題後的樣子，不計入完成人數；要拿掉時刪除 CODERS 與快照裡 id 為 0 的那一項即可。姓名顯示的是各 Coder 在 fzt-judge 的暱稱，每次更新資料時一併同步。資料來源：各 Coder 在 fzt-judge 的 UserStatistic 頁面。這是靜態頁，每次重抓資料並加入一份新快照後，才會出現新的動態；動態是比對前後兩份快照得出的，不含實際解題時間。</p>
</div>
<script>
var BASE="https://fzt-judge.com/";
var CODERS={
  49:{id:49,name:"Linda"},71:{id:71,name:"Daniel Liu"},57:{id:57,name:"時透無一郎"},48:{id:48,name:"roblox tai"},50:{id:50,name:"06黃以翔"},0:{id:0,name:"閃身步大師",sample:true},
  69:{id:69,name:"方祥睿"},66:{id:66,name:"蔡忠諺"}
};
/* 班級頁籤：key、顯示名稱、成員 id */
var CLASSES=[{key:"z",name:"Z班",ids:[49,71,57,48,50,0]},{key:"ad",name:"AD班",ids:[69,66]}];
/* 每次更新：在最後面加一筆快照（時間 + 每人的已通過題號，連號可寫 b001-b042）。新加入的人在第一份快照只當基準，不算「新解」 */
var SNAPSHOTS=[
 {t:"2026-11-15 05:10",ac:{
  49:"b001-b042 b086-b125 b130-b135 b138-b145 b149-b150 b153-b165 b168-b171 b174-b178 b180-b183",
  71:"b001-b033 b039 b099-b108 b110-b125 b130-b132 b134-b135 b138-b146 b150 b156-b165 b168-b171 b174-b178 b180-b181 b183",
  57:"b001-b003 b005-b042 b086-b097 b099-b122 b124-b125 b130-b135 b137-b146 b149-b150 b153-b165 b168-b171 b174-b178 b180-b183",
  48:"b001-b039 b086-b110 b116-b125 b130-b135 b138-b143 b146 b149-b150 b153-b165 b168-b171 b174-b178 b180-b183",
  50:"b001-b042 b086-b097 b099-b125 b130-b135 b138-b146 b149-b150 b153-b165 b168-b171 b174-b178 b180-b183",
  0:"b213"}},
 {t:"2026-11-15 13:05",ac:{
  49:"b001-b042 b086-b125 b130-b135 b138-b145 b149-b150 b153-b165 b168-b171 b174-b178 b180-b183",
  71:"b001-b033 b039 b099-b108 b110-b125 b130-b132 b134-b135 b138-b146 b150 b156-b165 b168-b171 b174-b178 b180-b181 b183",
  57:"b001-b003 b005-b042 b086-b097 b099-b122 b124-b125 b130-b135 b137-b146 b149-b150 b153-b165 b168-b171 b174-b178 b180-b183",
  48:"b001-b039 b086-b110 b116-b125 b130-b135 b138-b143 b146 b149-b150 b153-b165 b168-b171 b174-b178 b180-b183",
  50:"b001-b042 b086-b097 b099-b125 b130-b135 b138-b146 b149-b150 b153-b165 b168-b171 b174-b178 b180-b183",
  0:"b213",
  69:"b001-b027 b029-b042 b087-b096 b098-b103 b105-b107 b109-b110 b112 b114-b116 b118-b119 b121-b125 b135-b141 b145 b148 b153 b156 b169",
  66:"b001-b029 b031 b037-b042 b087-b111 b113-b115 b118-b125 b135-b139 b142 b156 b169"},
  /* 進行中：已提交過、但還沒通過的 DAILY 題（UserStatistic 上粗體灰字）。沒有就不用寫 */
  wip:{0:"b214 b215"}}
];
var TITLES=["小熊存錢買腳踏車", "幸運數字和", "細菌大爆炸", "吃不完的巧克力", "收銀機小幫手", "火箭倒數", "爬井的蝸牛", "越領越多的零用錢", "神奇的數字變身", "這是幾位數", "雲霄飛車身高限制", "電影票價", "寄包裹運費", "跳繩冠軍", "閏年與平年", "今天穿什麼", "拍手跳跳報數遊戲", "買飲料找零", "剪刀石頭布", "木棒三角形", "數羊睡覺", "九九乘法表", "幸運偶數號碼", "聖誕樹星星", "分糖果有幾種分法", "排隊有幾種排法", "兔子繁殖", "寶箱密碼是質數嗎", "黑白棋盤", "攝氏轉華氏表", "一週最高溫", "全班平均分數", "及格的人有幾個", "倒著排隊", "身高最高的是第幾個", "越來越熱的日子", "單數座位的點數", "失物招領", "擲骰子統計", "對稱的珠子項鍊", "成績單等第統計", "拍手報數遊戲", "零用錢日記", "班長選舉計票", "幸運號碼總和", "猜數字遊戲", "水庫警戒水位", "成績輸入小幫手", "數字裡的奇偶", "找零用的硬幣", "跳高比賽的亞軍", "比平均高的人", "連續升溫最久幾天", "合起來剛好的兩張牌", "補考名單", "數字三角形", "自己訂的乘法表", "同學互相握手", "方格的對角線", "質數寶藏表"];
var DL=213,DH=272;
function pid(n){return "b"+String(n).padStart(3,"0");}
function expand(s){if(s==null)return null;var o={};s.split(/\s+/).forEach(function(t){var m=t.match(/^b(\d+)(?:-b(\d+))?$/);if(!m)return;var a=+m[1],b=m[2]?+m[2]:a;for(var i=a;i<=b;i++)o[i]=1;});return o;}
function who(c){if(c.sample)return '<span class="nm">'+c.name+'</span> <span class="demo">範例</span>';return '<a class="nm" target="_blank" rel="noopener" href="'+BASE+'UserStatistic?id='+c.id+'">'+c.name+'</a>';}
function link(n,cls){return '<a class="'+cls+'" target="_blank" rel="noopener" href="'+BASE+'ShowProblem?problemid='+pid(n)+'">'+pid(n)+'</a>';}
var snaps=SNAPSHOTS.map(function(s){var sets={},wip={};Object.keys(s.ac).forEach(function(id){sets[id]=expand(s.ac[id]);wip[id]=expand((s.wip||{})[id])||{};});return {t:s.t,sets:sets,wip:wip};});
var last=snaps[snaps.length-1];
document.getElementById("stamp").textContent=last.t;
/* 兩份快照都有此人才比對；否則視為沒有資料可比 */
function diff(a,b,id){var A=a.sets[id],B=b.sets[id],out=[];if(!A||!B)return out;Object.keys(B).forEach(function(k){if(!A[k])out.push(+k);});return out.sort(function(x,y){return x-y;});}
function has(a,b,id){return !!(a.sets[id]&&b.sets[id]);}

function buildPanel(cls){
  var list=cls.ids.map(function(i){return CODERS[i];}).filter(function(c){return last.sets[c.id];});
  var real=list.filter(function(c){return !c.sample;});
  var prev=null;for(var q=snaps.length-2;q>=0;q--){if(list.some(function(c){return has(snaps[q],last,c.id);})){prev=snaps[q];break;}}
  var h='<h2 class="t">最新動態</h2><div class="panel feed" id="feed-'+cls.key+'"></div>'
   +'<h2 class="t">生活情境 DAILY 排行（b213～b272，共 60 題）</h2><div class="panel"><table class="rank"><thead><tr><th>名次</th><th>Coder</th><th>已解</th><th>進度</th><th>進行中</th><th>最近一次更新</th></tr></thead><tbody id="rank-'+cls.key+'"></tbody></table></div>'
   +'<h2 class="t">60 題完成表</h2><div class="panel" style="overflow-x:auto"><table class="rank done" id="done-'+cls.key+'"></table></div>';
  var el=document.createElement("div");el.id="panel-"+cls.key;el.setAttribute("role","tabpanel");el.innerHTML=h;
  document.getElementById("panels").appendChild(el);

  /* 最新動態 */
  var fh="";
  for(var i=snaps.length-1;i>=1;i--){
    var pair=list.filter(function(c){return has(snaps[i-1],snaps[i],c.id);});
    if(!pair.length)continue;
    var items="";
    pair.forEach(function(c){var d=diff(snaps[i-1],snaps[i],c.id);if(d.length){
      var tags=d.map(function(n){var first=true;for(var j=0;j<i;j++)list.forEach(function(o){if(snaps[j].sets[o.id]&&snaps[j].sets[o.id][n])first=false;});return link(n,"tag"+(first?" first":""));}).join("");
      items+='<li>'+who(c)+' 新解 '+d.length+' 題：'+tags+'</li>';}});
    fh+='<div class="feed-day">'+snaps[i-1].t+' → '+snaps[i].t+'</div>'+(items?'<ul>'+items+'</ul>':'<div class="empty">這段期間沒有人新解題</div>');
  }
  document.getElementById("feed-"+cls.key).innerHTML=fh||'<div class="empty">目前只有一份資料，下次更新後這裡會列出誰新解了哪題。橘底題號代表該題是全班第一次有人解出。</div>';

  /* DAILY 排行 */
  function dc(snap,id){var n=0;for(var k=DL;k<=DH;k++)if(snap.sets[id]&&snap.sets[id][k])n++;return n;}
  var rows=list.map(function(c){var n=dc(last,c.id);var w=0;for(var k=DL;k<=DH;k++)if(last.wip[c.id]&&last.wip[c.id][k]&&!last.sets[c.id][k])w++;return{c:c,n:n,wip:w,gain:prev&&has(prev,last,c.id)?n-dc(prev,c.id):null};});
  rows.sort(function(a,b){return b.n-a.n;});
  var tb=document.getElementById("rank-"+cls.key),rk=0,shown=0,lastN=null;
  rows.forEach(function(r){shown++;if(r.n!==lastN){rk=shown;lastN=r.n;}
    var tr=document.createElement("tr");
    tr.innerHTML='<td class="n">'+(r.n===0?"—":rk)+'</td><td>'+who(r.c)+'</td><td class="n">'+r.n+' / 60</td><td><div class="bar"><i style="width:'+(r.n/60*100)+'%"></i></div></td><td class="n">'+(r.wip?'<span class="wip" title="已提交、尚未通過">✎ '+r.wip+' 題</span>':'—')+'</td><td class="n">'+(r.gain===null?"—":(r.gain>0?'<span class="up">+'+r.gain+' 題</span>':'0'))+'</td>';
    tb.appendChild(tr);});

  /* 60 題完成表 */
  var t=document.getElementById("done-"+cls.key),th='<thead><tr><th>題號</th><th>題目</th>';
  list.forEach(function(c){th+='<th style="text-align:center">'+who(c)+'</th>';});
  th+='<th style="text-align:center">完成人數</th></tr></thead><tbody>';
  for(var n=DL;n<=DH;n++){
    var cnt=0,u=BASE+'ShowProblem?problemid='+pid(n),row='<tr><td class="n"><a class="plink" target="_blank" rel="noopener" href="'+u+'">'+pid(n)+'</a></td><td><a class="plink" target="_blank" rel="noopener" href="'+u+'">'+TITLES[n-DL]+'</a></td>';
    list.forEach(function(c){var ok=last.sets[c.id][n],isNew=prev&&has(prev,last,c.id)&&ok&&!prev.sets[c.id][n];if(ok&&!c.sample)cnt++;
      var doing=!ok&&last.wip[c.id]&&last.wip[c.id][n];
      row+='<td style="text-align:center">'+(ok?'<span class="chk'+(isNew?' new':'')+'">✓</span>':(doing?'<span class="wip" title="進行中：已提交、尚未通過">✎</span>':'<span class="dash">·</span>'))+'</td>';});
    th+=row+'<td class="n" style="text-align:center">'+cnt+' / '+real.length+'</td></tr>';
  }
  t.innerHTML=th+'</tbody>';
  return el;
}

/* 頁籤 */
var tabs=document.getElementById("tabs"),panels={},btns={};
CLASSES.forEach(function(cls){
  panels[cls.key]=buildPanel(cls);
  var b=document.createElement("button");b.type="button";b.setAttribute("role","tab");b.textContent=cls.name;b.addEventListener("click",function(){show(cls.key);});
  tabs.appendChild(b);btns[cls.key]=b;
});
function show(k){CLASSES.forEach(function(c){var on=c.key===k;panels[c.key].hidden=!on;btns[c.key].setAttribute("aria-selected",on?"true":"false");});try{history.replaceState(null,"","#"+k);}catch(e){}}
var start=(location.hash||"").slice(1);show(panels[start]?start:CLASSES[0].key);
</script>
</body>
</html>
